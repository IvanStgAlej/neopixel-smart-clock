name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install "platformio==6.1.*"

      # No include/secrets.h in CI: config.h falls back to secrets.example.h
      # and emits a #warning. That is expected.
      - name: Unit tests (native)
        run: pio test -e native

      - name: Build firmware
        run: pio run -e nodemcuv2

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/nodemcuv2/firmware.bin
          if-no-files-found: error
